name: release

# main에 머지(푸시)되면 버전을 하나 올려 윈도우 설치 파일과 맥 dmg를 만들고,
# 그 버전의 태그와 GitHub 릴리스를 자동으로 만든다.
#  - main 푸시: 마지막 태그의 끝자리를 하나 올린다 (v0.1.2 -> v0.1.3). 문서만 바뀐 푸시는 건너뛴다.
#  - 태그(v1.0.0 등)를 직접 올리면 그 버전으로 만든다.
#  - Actions 화면에서 버전을 적어 직접 실행할 수도 있다.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "examples/**"
  workflow_dispatch:
    inputs:
      version:
        description: "버전 (예: 0.2.0). 비우면 자동으로 하나 올림"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            V="${{ inputs.version }}"
            V="${V#v}"
          else
            git fetch --tags --force --quiet
            LAST=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
            if [[ -z "$LAST" ]]; then
              V="0.1.0"
            else
              IFS=. read -r MA MI PA <<< "${LAST#v}"
              V="$MA.$MI.$((PA + 1))"
            fi
          fi
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "잘못된 버전: $V"; exit 1; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "버전: $V"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
      APP_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Stamp version
        run: |
          python - <<'PY'
          import os, pathlib, re
          p = pathlib.Path("autoedit/__init__.py")
          p.write_text(re.sub(r'__version__ = "[^"]*"', f'__version__ = "{os.environ["APP_VERSION"]}"', p.read_text(encoding="utf-8")), encoding="utf-8")
          PY
          grep __version__ autoedit/__init__.py

      - name: Fetch FFmpeg (Windows)
        if: matrix.target == 'windows'
        run: |
          curl -L --fail --retry 3 -o ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip
          7z x ffmpeg.zip -offtmp > /dev/null
          mkdir -p bin
          cp fftmp/*/bin/ffmpeg.exe fftmp/*/bin/ffprobe.exe fftmp/*/bin/*.dll bin/
          ls -la bin

      - name: Fetch FFmpeg (macOS)
        if: matrix.target == 'macos'
        run: |
          mkdir -p bin
          for n in ffmpeg ffprobe; do
            curl -L --fail --retry 3 -o bin/$n.gz https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/$n-darwin-arm64.gz
            gunzip bin/$n.gz
            chmod +x bin/$n
          done
          ls -la bin

      - name: Check FFmpeg features
        run: |
          bin/ffmpeg -hide_banner -version | head -1
          bin/ffmpeg -hide_banner -filters > filters.txt
          grep -E " subtitles " filters.txt
          grep -E " zscale " filters.txt

      - name: Self-test (source)
        run: python run.py --selftest

      - name: Build
        run: pyinstaller packaging/auto-edit.spec --noconfirm

      - name: Self-test (packaged, Windows)
        if: matrix.target == 'windows'
        run: dist/auto-edit/auto-edit.exe --selftest

      - name: Self-test (packaged, macOS)
        if: matrix.target == 'macos'
        run: dist/auto-edit.app/Contents/MacOS/auto-edit --selftest

      - name: Installer (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$env:APP_VERSION" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist\*.exe

      - name: Disk image (macOS)
        if: matrix.target == 'macos'
        run: |
          mkdir dmg
          cp -R dist/auto-edit.app dmg/
          ln -s /Applications dmg/Applications
          for i in 1 2 3; do
            hdiutil create -volname auto-edit -srcfolder dmg -ov -format UDZO "dist/auto-edit-$APP_VERSION-macos-arm64.dmg" && break
            sleep 5
          done
          ls -la dist/*.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.target }}
          path: |
            dist/auto-edit-*-windows-setup.exe
            dist/auto-edit-*-macos-arm64.dmg
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # 태그가 없으면 이 커밋에 새로 만든다 (두 빌드가 모두 성공했을 때만 여기까지 온다)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          name: auto-edit v${{ env.APP_VERSION }}
          files: artifacts/*
          generate_release_notes: true
          body: |
            ## 설치 파일
            - **Windows**: `auto-edit-${{ env.APP_VERSION }}-windows-setup.exe`
            - **macOS (Apple Silicon)**: `auto-edit-${{ env.APP_VERSION }}-macos-arm64.dmg`

            FFmpeg가 함께 들어 있어 따로 설치할 필요가 없습니다. 받아쓰기 모델(약 610MB)은 첫 분석 때 한 번 내려받습니다.

            ## 처음 실행할 때
            서명하지 않은 프로그램이라 경고가 뜹니다.
            - Windows: "Windows의 PC 보호" 창에서 **추가 정보 → 실행**
            - macOS: 앱을 응용 프로그램 폴더로 옮긴 뒤, 열리지 않으면 **시스템 설정 → 개인정보 보호 및 보안 → 그래도 열기**

            빌드 과정의 자체 점검(FFmpeg 실행, 자막 입히기, 받아쓰기 엔진 불러오기)은 통과한 파일입니다.
